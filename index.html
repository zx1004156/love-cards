<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>戀話匣子｜戀愛聊天卡牌</title>
<script>
try{ var t = localStorage.getItem("love-cards-theme"); if(t==="light"||t==="dark") document.documentElement.setAttribute("data-theme", t);
  var l = localStorage.getItem("love-cards-lang"); if(l==="ja"||l==="en") document.documentElement.lang = l; }catch(e){}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&family=Zen+Maru+Gothic:wght@500&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6EEE7; --surface:#FFF9F4; --ink:#4A3530; --muted:#8A6F66; --line:#E6D5CB;
  --light:#F4D3CB; --medium:#E8C3AE; --deep:#A8646A; --any:#7A5550;
  --on-light:#4A3530; --on-medium:#4A3530; --on-deep:#FFF4F0; --on-any:#FFF4F0;
  --danger:#B3261E;
  --display:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  box-sizing:border-box;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#211816; --surface:#2D211E; --ink:#F4E6DF; --muted:#BFA79E; --line:#43322D;
  --light:#D9A99E; --medium:#CFA088; --deep:#9A5559; --any:#5E423D; --danger:#F2B8B5;
  --on-light:#2A1C19; --on-medium:#2A1C19; --on-deep:#FFF4F0; --on-any:#FFF4F0;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--medium);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:20px 18px 48px}

header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
h1{font-family:var(--display);font-weight:400;font-size:2.4rem;line-height:1;margin:0;letter-spacing:.04em}
.head-right{display:flex;align-items:center;gap:8px}
.theme-btn{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;color:var(--muted);font-size:.9rem;line-height:1}
.theme-btn .ico{font-size:1.05rem;color:var(--ink)}
.tabs{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.tabs button{border:0;background:none;padding:6px 18px;border-radius:999px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}

.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.levels button{border:2px solid transparent;border-radius:14px;padding:10px 4px;background:var(--surface);text-align:center;line-height:1.3}
.levels button b{display:block;font-family:var(--display);font-weight:400;font-size:1.15rem}
.levels button small{color:var(--muted);font-size:.75rem}
.levels button[aria-pressed="true"]{border-color:var(--ink)}
.levels button.empty-level{opacity:.45}
.levels .sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:1px}

.toggles{display:flex;gap:16px;flex-wrap:wrap;margin:6px 0 18px;color:var(--muted);font-size:.9rem}
.toggles label{display:flex;align-items:center;gap:6px;cursor:pointer}

/* the card */
.stage{perspective:1400px;display:flex;justify-content:center;margin:8px 0 18px}
.card{width:max(210px,min(100%,360px,calc((100svh - 370px) * .714)));aspect-ratio:5/7;container-type:inline-size;position:relative;cursor:pointer;border:0;padding:0;background:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.card .inner,.card .face,.card .face *{pointer-events:none}
.card .inner{position:absolute;inset:0;transition:transform .55s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d}
.card.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:22px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;box-shadow:0 18px 40px -18px rgba(20,24,40,.45)}
.back{display:grid;place-items:center;background:var(--bk,var(--any));color:var(--bk-on,var(--on-any))}
.back::before{content:"";position:absolute;inset:14px;border-radius:14px;border:2px solid currentColor;opacity:.35}
.back .pattern{position:absolute;inset:0;opacity:.14;background-image:radial-gradient(currentColor 2px,transparent 2.5px);background-size:22px 22px}
.back .mark{position:relative;text-align:center}
.back .mark span{display:block;font-family:var(--display);font-size:clamp(2rem,16cqi,3.2rem);line-height:1.1;letter-spacing:.08em}
.back .mark small{opacity:.8}
.front{transform:rotateY(180deg);background:var(--fc,var(--any));color:var(--fc-on,var(--on-any));display:flex;flex-direction:column;padding:22px 24px}
.corner{font-family:var(--display);font-size:1.6rem;line-height:1}
.corner.bottom{align-self:flex-end;transform:rotate(180deg)}
.qtext{flex:1;display:flex;align-items:center;font-family:var(--display);font-size:clamp(1.05rem,7.4cqi,1.75rem);line-height:1.55;overflow-wrap:anywhere;text-align:left}
.badges{display:flex;gap:6px;flex-wrap:wrap;min-height:26px}
.badge{font-size:.78rem;padding:2px 10px;border-radius:999px;border:1.5px solid currentColor;white-space:nowrap}
.hint{text-align:center;color:var(--muted);font-size:.9rem;margin:-6px 0 14px;min-height:1.6em}

.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:11px 22px;background:var(--ink);color:var(--bg);font-weight:500}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.small{padding:6px 12px;font-size:.88rem;border-radius:10px}
.btn.danger{color:var(--danger);border-color:currentColor}
.btn:disabled{opacity:.45;cursor:not-allowed}

details.rules{margin-top:28px;background:var(--surface);border-radius:16px;padding:14px 18px;border:1px solid var(--line)}
details.rules summary{cursor:pointer;font-weight:500}
details.rules ol{margin:10px 0 0;padding-left:1.3em;color:var(--muted)}

/* manage */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:18px}
.panel h2{font-size:1.1rem;margin:0 0 12px;font-weight:700}
textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg);resize:vertical;min-height:80px}
select{border:1.5px solid var(--line);border-radius:10px;padding:7px 10px;background:var(--bg)}
.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:12px 0}
.row label{display:flex;align-items:center;gap:6px}
.status{font-size:.85rem;color:var(--muted);margin:-8px 0 16px}
.notice{font-size:.9rem;padding:10px 14px;border-radius:12px;background:var(--bg);margin-bottom:14px}
.list{list-style:none;margin:0;padding:0}
.list li{display:grid;grid-template-columns:8px 1fr auto;gap:12px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.list .bar{width:8px;align-self:stretch;border-radius:4px}
.list .t{overflow-wrap:anywhere}
.list .meta{font-size:.8rem;color:var(--muted)}
.list .ops{display:flex;gap:6px}
.empty{color:var(--muted);text-align:center;padding:24px 8px}
.io{display:none;margin-top:12px}
.io.open{display:block}

@media (max-width:480px){
  h1{font-size:2rem}
  .toggles{gap:4px 12px;font-size:.84rem;margin:4px 0 14px}
  .toggles label{gap:4px}
  .hint{font-size:.84rem}
  .wrap{padding-top:14px}
  header{margin-bottom:14px}
  .theme-btn .lbl{display:none}
  .theme-btn{padding:8px 11px}
  .levels button small{display:none}
  .list li{grid-template-columns:6px 1fr}
  .list .ops{grid-column:2}
}
@media (prefers-reduced-motion: reduce){
  .card .inner{transition:none}
}
:root[lang="ja"]{--display:"Zen Maru Gothic","Noto Sans JP","Hiragino Sans",sans-serif;--ui:"Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif}
:root[lang="en"]{--display:"Nunito","Huninn",system-ui,sans-serif;--ui:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif}
:root[lang="en"] .back .mark span{font-size:clamp(1.6rem,11cqi,2.4rem);letter-spacing:.02em}
.levels button b{white-space:nowrap}
.lang-btn{font-weight:700;min-width:44px;justify-content:center;color:var(--ink)}
.field{display:block;margin-top:12px}
.field span{display:block;font-size:.85rem;color:var(--muted);margin-bottom:4px}
.field textarea{min-height:64px}
.list .tr{font-size:.85rem;color:var(--muted);overflow-wrap:anywhere}
@media (max-width:480px){ .levels button b{font-size:.98rem} .levels button{padding:9px 2px} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 data-i18n="title">戀話匣子</h1>
    <div class="head-right">
      <button class="theme-btn lang-btn" id="lang-btn" type="button">中</button>
      <button class="theme-btn" id="theme-btn" type="button"><span class="ico" id="theme-ico" aria-hidden="true">☀</span><span class="lbl" id="theme-lbl">淺色</span></button>
      <div class="tabs" role="tablist">
        <button role="tab" id="tab-play" aria-selected="true" data-i18n="tabPlay">抽牌</button>
        <button role="tab" id="tab-manage" aria-selected="false" data-i18n="tabManage">題庫</button>
      </div>
    </div>
  </header>

  <!-- PLAY -->
  <section id="view-play">
    <div class="levels" id="levels"></div>
    <div class="toggles">
      <label><input type="checkbox" id="only-humor"> <span data-i18n="onlyHumor">只抽幽默題 ★</span></label>
      <label><input type="checkbox" id="only-guess"> <span data-i18n="onlyGuess">只抽猜猜看</span></label>
      <label><input type="checkbox" id="only-partner"> <span data-i18n="onlyPartner">只抽伴侶卡</span></label>
    </div>

    <div class="stage">
      <button class="card" id="card" aria-live="polite" data-i18n-aria="cardAria">
        <div class="inner">
          <div class="face back" id="back">
            <div class="pattern"></div>
            <div class="mark"><span data-i18n="title">戀話匣子</span><small id="back-label"></small></div>
          </div>
          <div class="face front" id="front">
            <div class="corner" id="corner-top"></div>
            <div class="qtext" id="qtext"></div>
            <div class="badges" id="badges"></div>
            <div class="corner bottom" id="corner-bottom"></div>
          </div>
        </div>
      </button>
    </div>
    <p class="hint" id="hint"></p>
    <div class="actions">
      <button class="btn" id="draw"></button>
      <button class="btn ghost" id="shuffle" data-i18n="shuffle">重新洗牌</button>
    </div>

    <details class="rules">
      <summary data-i18n="rulesTitle">建議玩法</summary>
      <ol id="rules"></ol>
    </details>
  </section>

  <!-- MANAGE -->
  <section id="view-manage" hidden>
    <p class="status" id="status"></p>
    <div class="notice" id="ro-notice" hidden data-i18n="roNotice"></div>

    <div class="panel" id="editor">
      <h2 id="editor-title"></h2>
      <label class="field"><span data-i18n="fZh"></span><textarea id="f-text" maxlength="200" data-i18n-ph="phZh"></textarea></label>
      <label class="field"><span data-i18n="fJa"></span><textarea id="f-ja" maxlength="200" data-i18n-ph="phJa"></textarea></label>
      <label class="field"><span data-i18n="fEn"></span><textarea id="f-en" maxlength="300" data-i18n-ph="phEn"></textarea></label>
      <div class="row">
        <select id="f-level" data-i18n-aria="levelAria">
          <option value="light"></option>
          <option value="medium"></option>
          <option value="deep"></option>
        </select>
        <label><input type="checkbox" id="f-humor"> <span data-i18n="humorLabel"></span></label>
        <label><input type="checkbox" id="f-guess"> <span data-i18n="guessLabel"></span></label>
        <label><input type="checkbox" id="f-partner"> <span data-i18n="partnerLabel"></span></label>
      </div>
      <div class="actions" style="justify-content:flex-start">
        <button class="btn" id="f-save"></button>
        <button class="btn ghost" id="f-cancel" hidden data-i18n="cancel"></button>
      </div>
      <p class="hint" id="f-msg" style="text-align:left;margin:10px 0 0"></p>
    </div>

    <div class="panel">
      <div class="row" style="margin-top:0;justify-content:space-between">
        <h2 style="margin:0" id="list-title"></h2>
        <select id="list-filter" data-i18n-aria="levelAria">
          <option value="all" data-i18n="filterAll"></option>
          <option value="light"></option>
          <option value="medium"></option>
          <option value="deep"></option>
        </select>
      </div>
      <ul class="list" id="list"></ul>
    </div>

    <div class="panel">
      <h2 data-i18n="ioTitle"></h2>
      <p class="meta" style="color:var(--muted);margin:0 0 10px;font-size:.9rem" data-i18n="ioDesc"></p>
      <div class="actions" style="justify-content:flex-start">
        <button class="btn ghost small" id="btn-export" data-i18n="export"></button>
        <button class="btn ghost small" id="btn-import" data-i18n="import"></button>
      </div>
      <div class="io" id="export-box">
        <textarea id="export-text" readonly rows="6"></textarea>
        <div class="actions" style="justify-content:flex-start;margin-top:8px">
          <button class="btn small" id="btn-copy" data-i18n="copy"></button>
        </div>
      </div>
      <div class="io" id="import-box">
        <textarea id="import-text" rows="6" placeholder='[{"text":"題目內容","ja":"","en":"","level":"light","humor":false,"guess":false}]'></textarea>
        <div class="actions" style="justify-content:flex-start;margin-top:8px">
          <button class="btn small" id="btn-do-import" data-i18n="doImport"></button>
        </div>
      </div>
      <p class="hint" id="io-msg" style="text-align:left;margin:10px 0 0"></p>
    </div>
  </section>
</div>

<script>
/* ---------- language ---------- */
const LANGS = ["zh","ja","en"];
const HTML_LANG = {zh:"zh-Hant", ja:"ja", en:"en"};
const LANG_KEY = "love-cards-lang";
let lang = "zh";
try{ const l = localStorage.getItem(LANG_KEY); if(LANGS.includes(l)) lang = l; }catch(e){}

const LEVEL_TEXT = {
  zh:{all:["隨機","三種混合"], light:["輕度","喜好與經驗","輕"], medium:["中度","相處與價值觀","中"], deep:["深度","內心與過去","深"]},
  ja:{all:["ランダム","3つをミックス"], light:["軽め","好みと思い出","軽"], medium:["普通","付き合い方と価値観","普"], deep:["深め","本音と過去","深"]},

    emptyFilter:(lv,h,g,pt)=>`${lv}目前沒有符合條件的題目，取消勾選${[h?"「只抽幽默題」":"",g?"「只抽猜猜看」":"",pt?"「只抽伴侶卡」":""].filter(Boolean).join("或")}就能繼續抽`,

 ["medium", "你覺得我最近有什麼變化？", 0, 0, "最近の私、何か変わったと思う？", "Have you noticed anything different about me lately?", 1],
 ["medium", "有什麼是我做了你會很開心，但我可能不知道的？", 0, 0, "私がしたらすごくうれしいのに、私が気づいてなさそうなことってある？", "Is there something that would make you really happy that I might not know about?", 1],
 ["medium", "你最喜歡我們怎麼和好？", 0, 0, "ふたりの仲直りの仕方で、いちばん好きなのは？", "What's your favorite way for us to make up?", 1],
 ["medium", "我們最近一次笑到停不下來是什麼時候？", 0, 0, "ふたりで最後に笑いが止まらなくなったのはいつ？", "When was the last time we couldn't stop laughing together?", 1],
 ["medium", "你覺得我們有什麼相處習慣，可以再調整一下？", 0, 0, "ふたりの過ごし方で、ちょっと変えてみたいところってある？", "Is there a habit in how we spend time together you'd like to adjust?", 1],
 ["medium", "猜猜看我壓力大的時候，最希望你怎麼做。", 0, 1, "私がストレスでいっぱいのとき、あなたにいちばんしてほしいことを当ててみて。", "Guess what I most want you to do when I'm stressed.", 1],
 ["deep", "有沒有哪一刻，你覺得特別被我需要？", 0, 0, "私に必要とされてるって、特に感じた瞬間はある？", "Has there been a moment you felt especially needed by me?", 1],
 ["deep", "你覺得我們一起度過最難的一段時間是什麼時候？", 0, 0, "ふたりで乗り越えた、いちばん大変だった時期はいつだと思う？", "What do you think was the hardest time we've gotten through together?", 1],
 ["deep", "你最想跟我一起完成的一件事是什麼？", 0, 0, "私と一緒にいちばん叶えたいことは何？", "What's one thing you most want us to do together someday?", 1],
 ["deep", "有沒有什麼，是你希望我們之間永遠不要改變的？", 0, 0, "ふたりの間で、ずっと変わらないでほしいことってある？", "Is there something between us you hope never changes?", 1],
 ["deep", "你覺得我們的關係，最珍貴的地方是什麼？", 0, 0, "ふたりの関係で、いちばん大切だと思うところは？", "What do you think is the most precious thing about us?", 1],
 ["deep", "如果用一句話形容我們，你會怎麼說？", 0, 0, "ふたりのことを一言で表すとしたら？", "If you had to describe us in one sentence, what would you say?", 1]
].map((r,i)=>({id:STARTER_IDS[i],level:r[0],text:r[1],humor:!!r[2],guess:!!r[3],ja:r[4]||"",en:r[5]||"",partner:!!r[6],createdAt:i}));

const LS_KEY = "love-cards-questions-v1", LS_V2 = "love-cards-unused-v2", LS_OLD = "love-cards-unused-v0";
const $ = id => document.getElementById(id);

let questions = [];
let mode = "loading";   // loading | db | local
let db = null, readOnly = false;
let level = "all", onlyHumor = false, onlyGuess = false, onlyPartner = false;
let drawn = new Set(), current = null, flipped = false, lockUntil = 0, flipTimer = null;
let editingId = null, pendingDelete = null;

/* ---------- storage ---------- */
// The browser keeps its own copy of the question bank. When this file ships a newer
// built-in list, built-in questions the person never edited are refreshed; their own
// questions, edits and deletions are kept.
const pick = q => ({text:q.text, ja:q.ja||"", en:q.en||"", level:q.level, humor:!!q.humor, guess:!!q.guess, partner:!!q.partner});
const same = (a,b) => a && b && a.text===b.text && (a.ja||"")===(b.ja||"") && (a.en||"")===(b.en||"") && a.level===b.level && !!a.humor===!!b.humor && !!a.guess===!!b.guess && !!a.partner===!!b.partner;
function starterBase(){ const m = {}; for(const q of STARTER) m[q.id] = pick(q); return m; }
function mergeWithStarter(list, base){
  const st = new Map(STARTER.map(q=>[q.id,q]));
  const out = [], have = new Set();
  for(const q of list){
    if(!q || typeof q.text!=="string") continue;
    const cur = st.get(q.id);
    if(cur && !(base && base[q.id] && !same(q, base[q.id]))) out.push({...cur});   // unedited built-in -> newest version
    else out.push(q);                                                              // edited built-in or own question
    have.add(q.id);
  }
  for(const q of STARTER){
    if(have.has(q.id)) continue;
    if(!base || base[q.id]) continue;   // was there before and got deleted: keep it deleted
    out.push({...q});                   // brand-new built-in question
  }
  return out;
}
function readJSON(k){ try{ return JSON.parse(localStorage.getItem(k) || "null"); }catch(e){ return null; } }
function lsLoad(){
  let list;
  const v3 = readJSON(LS_KEY);
  if(v3 && Array.isArray(v3.list)) list = mergeWithStarter(v3.list, v3.base || {});
  else {
    const v2 = readJSON(LS_V2);
    if(Array.isArray(v2)) list = mergeWithStarter(v2, null);
    else {
      list = STARTER.map(q=>({...q}));
      const o = readJSON(LS_OLD);
      if(Array.isArray(o)){
        const texts = new Set(list.map(q=>q.text));
        for(const q of o){ if(q && q.text && !texts.has(q.text)){ list.push(q); texts.add(q.text); } }
      }
    }
  }
  questions = list; lsSave();
  return list;
}
function lsSave(){ try{ localStorage.setItem(LS_KEY, JSON.stringify({base: starterBase(), list: questions})); }catch(e){} }

function useLocal(){ mode = "local"; questions = lsLoad(); onData(); }

async function init(){
  renderLevels(); renderCardBack();
  if(!window.claude || typeof window.claude.use !== "function"){ useLocal(); return; }
  let handle = null;
  try{ handle = await window.claude.use("db"); }catch(e){}
  if(!handle){ useLocal(); return; }
  db = handle; mode = "db";
  db.collection("questions").onSnapshot(snap=>{
    questions = snap.docs.map(d=>({id:d.id, ...d.data()}));
    onData();
  }, err=>{ if(!questions.length) useLocal(); });
}

async function saveQuestion(q){
  if(mode === "db"){
    const {id, ...data} = q;
    try{ await db.collection("questions").doc(id).set(data); return true; }
    catch(e){ handleWriteError(e); return false; }
  }
  const i = questions.findIndex(x=>x.id===q.id);
  if(i>=0) questions[i] = q; else questions.push(q);
  lsSave(); onData(); return true;
}
async function removeQuestion(id){
  if(mode === "db"){
    try{ await db.collection("questions").doc(id).delete(); return true; }
    catch(e){ handleWriteError(e); return false; }
  }
  questions = questions.filter(q=>q.id!==id); lsSave(); onData(); return true;
}
function handleWriteError(e){
  const code = e && e.code;
  if(code === "not_granted" || code === "revoked"){ readOnly = true; renderManage(); }
  else { $("f-msg").textContent = T().saveFail; }
}
const newId = () => "q" + Date.now().toString(36) + Math.random().toString(36).slice(2,6);

/* ---------- play ---------- */
function valid(q){ return q && typeof q.text==="string" && LEVELS[q.level] && qText(q); }
function poolFor(lv){
  return questions.filter(q => valid(q) && (lv==="all" || q.level===lv) && (!onlyHumor || q.humor) && (!onlyGuess || q.guess) && (onlyPartner ? !!q.partner : !q.partner));
}
function pool(){ return poolFor(level); }
function hiddenPartnerCount(){
  return questions.filter(q => valid(q) && q.partner && (level==="all" || q.level===level) && (!onlyHumor || q.humor) && (!onlyGuess || q.guess)).length;
}
function renderLevels(){
  const box = $("levels"); box.innerHTML = "";
  for(const k of ["all","light","medium","deep"]){
    const b = document.createElement("button");
    b.setAttribute("aria-pressed", String(level===k));
    const sw = document.createElement("span"); sw.className="sw"; sw.style.background = `var(--${k==="all"?"any":k})`;
    const t = document.createElement("b"); t.append(sw, lvName(k));
    const s = document.createElement("small");
    const n = mode==="loading" ? null : poolFor(k).length;
    s.textContent = (onlyHumor || onlyGuess || onlyPartner) && n !== null ? T().count(n) : lvHint(k);
    if(n === 0) b.classList.add("empty-level");
    b.append(t, s);
    b.onclick = () => { level = k; renderLevels(); resetDeck(); };
    box.append(b);
  }
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function resetDeck(){
  clearTimeout(flipTimer); lockUntil = 0;
  drawn = new Set();
  current = null;
  if(flipped){ flipped=false; $("card").classList.remove("flipped"); }
  renderCardBack(); updateHint();
}
function remaining(){ return pool().filter(q=>!drawn.has(q.id)).length; }
function updateHint(){
  const s = T();
  if(mode==="loading"){ $("hint").textContent = s.loading; $("draw").textContent = s.draw; $("draw").disabled = true; return; }
  const p = pool().length;
  if(!p){
    $("hint").textContent = (onlyHumor || onlyGuess || onlyPartner)
      ? s.emptyFilter(level==="all" ? "" : lvName(level), onlyHumor, onlyGuess, onlyPartner)
      : s.emptyAll;
    $("draw").textContent = s.draw;
    $("draw").disabled = true; return;
  }
  $("draw").disabled = false;
  $("draw").textContent = current ? s.next : s.draw;
  const r = remaining();
  const hp = !onlyPartner && !current ? hiddenPartnerCount() : 0;
  $("hint").textContent = (current ? (r ? s.hintLeft(r) : s.hintDone) : s.hintStart(p))
    + (onlyPartner ? s.partnerOnlyNote : (hp ? s.partnerExtra(hp) : ""));
}
function renderCardBack(){
  const c = level==="all" ? "any" : level;
  const back = $("back");
  back.style.setProperty("--bk", `var(--${c})`);
  back.style.setProperty("--bk-on", `var(--on-${c})`);
  $("back-label").textContent = lvName(level);
}
function fillFront(q){
  const f = $("front");
  f.style.setProperty("--fc", `var(--${q.level})`);
  f.style.setProperty("--fc-on", `var(--on-${q.level})`);
  $("corner-top").textContent = lvShort(q.level);
  $("corner-bottom").textContent = lvShort(q.level);
  $("qtext").textContent = qText(q);
  const b = $("badges"); b.innerHTML = "";
  const add = t => { const s=document.createElement("span"); s.className="badge"; s.textContent=t; b.append(s); };
  add(lvName(q.level));
  if(q.humor) add(T().badgeHumor);
  if(q.guess) add(T().badgeGuess);
  if(q.partner) add(T().badgePartner);
}
const reduced = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function draw(){
  const now = Date.now();
  if(now < lockUntil) return;              // ignore double taps during the flip
  const ids = new Set(pool().map(q=>q.id));
  if(!ids.size){ updateHint(); return; }
  let left = [...ids].filter(id=>!drawn.has(id));
  if(!left.length){                        // round finished: start a new one
    drawn = new Set();
    left = [...ids].filter(id=>id!==current);
    if(!left.length) left = [...ids];
  }
  const pickId = left[Math.floor(Math.random()*left.length)];
  drawn.add(pickId);
  const q = questions.find(x=>x.id===pickId);
  if(!valid(q)){ updateHint(); return; }
  const card = $("card");
  const reveal = () => {
    try{ current = q.id; fillFront(q); }
    finally{ flipped = true; card.classList.add("flipped"); updateHint(); }
  };
  clearTimeout(flipTimer);
  if(flipped && !reduced()){
    lockUntil = now + 450;
    card.classList.remove("flipped"); flipped = false;
    flipTimer = setTimeout(reveal, 420);
  } else {
    lockUntil = now + 150;
    reveal();
  }
}

/* ---------- manage ---------- */
function renderManage(){
  const s = T();
  const missing = lang==="zh" ? 0 : questions.filter(q=>!qText(q)).length;
  $("status").textContent = mode==="db" ? s.statusDb(questions.length) + s.statusMissing(missing)
                          : mode==="local" ? s.statusLocal(questions.length) + s.statusMissing(missing) : s.loading;
  $("ro-notice").hidden = !readOnly;
  for(const id of ["f-text","f-ja","f-en","f-level","f-humor","f-guess","f-partner","f-save","btn-import","btn-do-import"]) $(id).disabled = readOnly;
  $("editor-title").textContent = editingId ? s.editorEdit : s.editorAdd;
  $("f-save").textContent = editingId ? s.saveEdit : s.saveAdd;
  const filter = $("list-filter").value;
  const order = ["light","medium","deep"];
  const items = questions.filter(q=>filter==="all"||q.level===filter)
    .sort((a,b)=>order.indexOf(a.level)-order.indexOf(b.level) || (a.createdAt||0)-(b.createdAt||0));
  $("list-title").textContent = s.listTitle(items.length);
  const ul = $("list"); ul.innerHTML = "";
  if(!items.length){ const li=document.createElement("li"); li.className="empty"; li.style.display="block"; li.textContent=s.listEmpty; ul.append(li); return; }
  for(const q of items){
    if(!LEVELS[q.level]) continue;
    const li = document.createElement("li");
    const bar = document.createElement("span"); bar.className="bar"; bar.style.background=`var(--${q.level})`;
    const body = document.createElement("div");
    const t = document.createElement("div"); t.className="t"; t.textContent = qText(q) || q.text;
    body.append(t);
    if(lang!=="zh" && qText(q)){ const z=document.createElement("div"); z.className="tr"; z.textContent=q.text; body.append(z); }
    const m = document.createElement("div"); m.className="meta";
    m.textContent = [lvName(q.level), q.humor?s.badgeHumor:"", q.guess?s.badgeGuess:"", q.partner?s.badgePartner:"", (lang!=="zh" && !qText(q)) ? s.noTr : ""].filter(Boolean).join(" · ");
    body.append(m);
    const ops = document.createElement("div"); ops.className="ops";
    if(!readOnly){
      const e = document.createElement("button"); e.className="btn ghost small"; e.textContent=s.edit; e.onclick=()=>startEdit(q);
      const d = document.createElement("button"); d.className="btn ghost small danger";
      d.textContent = pendingDelete===q.id ? s.delConfirm : s.del;
      d.onclick = async ()=>{
        if(pendingDelete!==q.id){ pendingDelete=q.id; renderManage(); return; }
        pendingDelete=null; if(editingId===q.id) stopEdit(); await removeQuestion(q.id);
      };
      ops.append(e,d);
    }
    li.append(bar,body,ops); ul.append(li);
  }
}
function startEdit(q){
  editingId = q.id;
  $("f-text").value = q.text; $("f-ja").value = q.ja || ""; $("f-en").value = q.en || "";
  $("f-level").value = q.level;
  $("f-humor").checked = !!q.humor; $("f-guess").checked = !!q.guess; $("f-partner").checked = !!q.partner;
  $("f-cancel").hidden = false; $("f-msg").textContent = "";
  renderManage();
  $("editor").scrollIntoView({behavior: reduced()?"auto":"smooth", block:"start"});
  $("f-text").focus();
}
function stopEdit(){
  editingId = null;
  $("f-text").value = ""; $("f-ja").value = ""; $("f-en").value = "";
  $("f-humor").checked = false; $("f-guess").checked = false; $("f-partner").checked = false;
  $("f-cancel").hidden = true;
  renderManage();
}
async function submit(){
  const s = T();
  const text = $("f-text").value.trim();
  if(!text){ $("f-msg").textContent = s.needText; $("f-text").focus(); return; }
  const base = editingId ? questions.find(q=>q.id===editingId) : null;
  const q = { id: editingId || newId(), text, ja: $("f-ja").value.trim(), en: $("f-en").value.trim(), level: $("f-level").value,
    humor: $("f-humor").checked, guess: $("f-guess").checked, partner: $("f-partner").checked,
    createdAt: base ? (base.createdAt||0) : Date.now() };
  const wasEdit = !!editingId;
  $("f-save").disabled = true;
  const ok = await saveQuestion(q);
  $("f-save").disabled = readOnly;
  if(ok){ stopEdit(); $("f-msg").textContent = wasEdit ? s.saved : s.added(lvName(q.level)); }
}

/* export / import */
function toggleBox(id){ for(const b of ["export-box","import-box"]) $(b).classList.toggle("open", b===id && !$(b).classList.contains("open")); $("io-msg").textContent=""; }
function doExport(){
  const data = questions.map(({text,ja,en,level,humor,guess,partner})=>({text,ja:ja||"",en:en||"",level,humor:!!humor,guess:!!guess,partner:!!partner}));
  $("export-text").value = JSON.stringify(data, null, 1);
  toggleBox("export-box");
}
async function doCopy(){
  const ta = $("export-text");
  try{ await navigator.clipboard.writeText(ta.value); $("io-msg").textContent = T().copied; }
  catch(e){ ta.focus(); ta.select(); $("io-msg").textContent = T().copyManual; }
}
async function doImport(){
  const s = T();
  let arr;
  try{ arr = JSON.parse($("import-text").value); }catch(e){ $("io-msg").textContent = s.importBad; return; }
  if(!Array.isArray(arr)){ $("io-msg").textContent = s.importBad; return; }
  const existing = new Set(questions.map(q=>q.text));
  const ok = arr.filter(x=>x && typeof x.text==="string" && x.text.trim() && LEVELS[x.level] && !existing.has(x.text.trim()));
  if(!ok.length){ $("io-msg").textContent = s.importNone; return; }
  $("btn-do-import").disabled = true;
  let n = 0;
  for(const x of ok){
    const str = v => typeof v==="string" ? v.trim().slice(0,300) : "";
    const saved = await saveQuestion({id:newId(), text:x.text.trim().slice(0,200), ja:str(x.ja), en:str(x.en), level:x.level, humor:!!x.humor, guess:!!x.guess, partner:!!x.partner, createdAt:Date.now()+n});
    if(!saved) break; n++;
  }
  $("btn-do-import").disabled = readOnly;
  $("io-msg").textContent = s.importDone(n);
  if(n){ $("import-text").value = ""; }
}

/* ---------- theme ---------- */
const THEME_KEY = "love-cards-theme";
let theme = "light";
try{ if(localStorage.getItem(THEME_KEY)==="dark") theme = "dark"; }catch(e){}
function applyTheme(){
  document.documentElement.setAttribute("data-theme", theme);
  const s = T();
  const cur = theme==="dark" ? s.themeDark : s.themeLight, nxt = theme==="dark" ? s.themeLight : s.themeDark;
  $("theme-ico").textContent = theme==="dark" ? "☾" : "☀";
  $("theme-lbl").textContent = cur;
  $("theme-btn").setAttribute("aria-label", s.themeAria(cur, nxt));
  $("theme-btn").title = s.themeAria(cur, nxt);
}
$("theme-btn").onclick = () => {
  theme = theme==="dark" ? "light" : "dark";
  try{ localStorage.setItem(THEME_KEY, theme); }catch(e){}
  applyTheme();
};

/* ---------- apply language ---------- */
function applyLang(){
  const s = T();
  document.documentElement.lang = HTML_LANG[lang];
  document.title = s.docTitle;
  document.querySelectorAll("[data-i18n]").forEach(el=>{ const v = s[el.dataset.i18n]; if(typeof v==="string") el.textContent = v; });
  document.querySelectorAll("[data-i18n-aria]").forEach(el=>{ el.setAttribute("aria-label", s[el.dataset.i18nAria]); });
  document.querySelectorAll("[data-i18n-ph]").forEach(el=>{ el.placeholder = s[el.dataset.i18nPh]; });
  for(const sel of ["f-level","list-filter"]) for(const o of $(sel).options) if(o.value!=="all") o.textContent = lvName(o.value);
  const ol = $("rules"); ol.innerHTML = ""; for(const r of s.rules){ const li=document.createElement("li"); li.textContent=r; ol.append(li); }
  const next = STR[LANGS[(LANGS.indexOf(lang)+1)%LANGS.length]].langName;
  $("lang-btn").textContent = s.langBtn;
  $("lang-btn").setAttribute("aria-label", s.langAria(next)); $("lang-btn").title = s.langAria(next);
  applyTheme(); renderLevels(); renderCardBack(); renderManage();
  if(current){
    const q = questions.find(x=>x.id===current);
    if(valid(q)) fillFront(q); else resetDeck();
  }
  updateHint();
}
$("lang-btn").onclick = () => {
  lang = LANGS[(LANGS.indexOf(lang)+1)%LANGS.length];
  try{ localStorage.setItem(LANG_KEY, lang); }catch(e){}
  applyLang();
};

/* ---------- wiring ---------- */
function onData(){ renderManage(); renderLevels(); updateHint(); }
function showTab(which){
  const play = which==="play";
  $("tab-play").setAttribute("aria-selected", String(play));
  $("tab-manage").setAttribute("aria-selected", String(!play));
  $("view-play").hidden = !play; $("view-manage").hidden = play;
  if(play) updateHint(); else renderManage();
}
$("tab-play").onclick = ()=>showTab("play");
$("tab-manage").onclick = ()=>showTab("manage");
$("card").onclick = draw;
$("draw").onclick = draw;
$("shuffle").onclick = resetDeck;
$("only-humor").onchange = e=>{ onlyHumor = e.target.checked; renderLevels(); resetDeck(); };
$("only-guess").onchange = e=>{ onlyGuess = e.target.checked; renderLevels(); resetDeck(); };
$("only-partner").onchange = e=>{ onlyPartner = e.target.checked; renderLevels(); resetDeck(); };
$("f-save").onclick = submit;
$("f-cancel").onclick = ()=>{ stopEdit(); $("f-msg").textContent=""; };
$("list-filter").onchange = renderManage;
$("btn-export").onclick = doExport;
$("btn-import").onclick = ()=>toggleBox("import-box");
$("btn-copy").onclick = doCopy;
$("btn-do-import").onclick = doImport;
applyLang();
init();

</script>
</body>
